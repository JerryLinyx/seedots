[project]
name = "seedots-services"
version = "0.1.0"
description = "SeeDots backend: video analysis foundation (media) + learning backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "yt-dlp[default]>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seedots*"]

[tool.setuptools.package-data]
"seedots" = ["**/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
