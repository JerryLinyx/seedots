# One section per service; each owns its own database and history.
#   alembic -n media upgrade head
#   alembic -n learning revision --autogenerate -m "add x"
# Database URLs come from SEEDOTS_MEDIA_DB_URL / SEEDOTS_LEARNING_DB_URL (or data/*.sqlite3).

[media]
script_location = %(here)s/migrations/media
service = media

[learning]
script_location = %(here)s/migrations/learning
service = learning

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
